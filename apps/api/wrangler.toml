name = "myweather"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# Account ID is provided at deploy time via the CLOUDFLARE_ACCOUNT_ID env
# var (set as a GitHub Actions secret). We deliberately do not commit it
# here — see SPEC §10 "Secrets & deploy".

# Serve the SPA build directly from this Worker. Routes that don't match
# /api/* fall through to the static assets (with SPA fallback to index.html
# so deep links like /?lat=…&lon=… work).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "WEATHER_CACHE"
class_name = "WeatherCache"

# Free-tier requires the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WeatherCache"]

[vars]
APP_ENV = "production"

[observability]
enabled = true
